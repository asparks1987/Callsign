name: Bug report
description: Report reproducible Callsign behavior
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not attach raw voice samples, private transcripts, unredacted logs, or secrets.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installer
        - UI/profile
        - Voice enrollment
        - Wake/identity/session
        - Overlay
        - App launch
        - Dictation
        - Browser
        - File search
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sanitized environment and diagnostics
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed raw audio, personal transcripts, secrets, and unredacted paths.
          required: true
